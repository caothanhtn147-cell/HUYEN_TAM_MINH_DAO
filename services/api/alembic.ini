# A generic, single database configuration for Alembic.

[alembic]
# Path to migration script directory
script_location = alembic

# Template used to generate revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, prepend to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# Timezone to use when rendering the date within the revision file
# timezone = UTC

# Max length of characters for "slug" in filename
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a matching .py file
# to be treated as revisions in the file hierarchy
sourceless = false

# Location of migration scripts (relative to alembic.ini)
version_locations = %(here)s/alembic/versions

# Version path separator
version_path_separator = os

# Non-secret placeholder URL. Real runtime DATABASE_URL is supplied dynamically by alembic/env.py via application Settings.
# THIS PLACEHOLDER MUST NEVER BE USED AS A PRODUCTION CREDENTIAL.
sqlalchemy.url = postgresql+asyncpg://invalid_user:invalid_password@127.0.0.1:5432/invalid_db

[post_write_hooks]

[logging]
default_handler = console

[loggers]
keys = root, alembic, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
