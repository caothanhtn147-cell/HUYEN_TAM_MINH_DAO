version: '3.8'

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: huyentam_api_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=huyentam_prod
      - POSTGRES_USER=${POSTGRES_USER:-huyentam_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-HuyenTamMasterKey2026!}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: huyentam_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: huyentam_prod
      POSTGRES_USER: ${POSTGRES_USER:-huyentam_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-HuyenTamMasterKey2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: huyentam_redis_prod
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_prod_data:
